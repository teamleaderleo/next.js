name: Fieldwork current Next.js instant navigation characterization

on:
  push:
    branches:
      - canary
    paths:
      - .github/workflows/fieldwork-next-current-instant-navigation.yml

permissions:
  contents: read

concurrency:
  group: fieldwork-next-current-instant-navigation
  cancel-in-progress: true

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact upstream Next.js source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: vercel/next.js
          ref: 5e8f31f7bdf7f564ec98a42e205f7e5b665398da
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Inject Fieldwork characterization test
        shell: bash
        run: |
          cat > test/e2e/app-dir/instant-navigation-testing-api/instant-navigation-origin-isolation.test.ts <<'EOF'
          import {
            NextInstance,
            nextTestSetup,
          } from 'e2e-utils'
          import { instant } from '@next/playwright'
          import type * as Playwright from 'playwright'
          import { join } from 'node:path'

          async function openPage(next: NextInstance) {
            let page: Playwright.Page
            await next.browser('/', {
              beforePageLoad(p) {
                page = p
              },
            })
            return page!
          }

          describe('instant navigation origin isolation', () => {
            const { next } = nextTestSetup({
              files: join(__dirname, 'fixtures', 'default'),
            })

            it('preserves an instant-navigation cookie owned by another origin', async () => {
              const page = await openPage(next)
              const context = page.context()
              const otherDomain = 'other.example'
              const otherValue = JSON.stringify([1, 'other-origin', null])

              await context.addCookies([
                {
                  name: 'next-instant-navigation-testing',
                  value: otherValue,
                  domain: otherDomain,
                  path: '/',
                },
              ])

              await instant(page, async () => {
                const otherOriginCookie = (await context.cookies()).find(
                  (cookie) =>
                    cookie.name === 'next-instant-navigation-testing' &&
                    cookie.domain === otherDomain &&
                    cookie.path === '/'
                )

                expect(otherOriginCookie?.value).toBe(otherValue)
              })
            })
          })
          EOF

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm build

      - name: Run focused production characterization
        shell: bash
        run: |
          set -o pipefail
          pnpm test-start test/e2e/app-dir/instant-navigation-testing-api/instant-navigation-origin-isolation.test.ts 2>&1 | tee fieldwork-instant-navigation-origin-isolation.log

      - name: Retain focused output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fieldwork-instant-navigation-origin-isolation
          path: fieldwork-instant-navigation-origin-isolation.log
          if-no-files-found: ignore
          retention-days: 7
